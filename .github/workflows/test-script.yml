name: Test script
on:
    workflow_dispatch:
jobs:
    test:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
        - name: Checkout Repo
          uses: actions/checkout@v4
        
        - name: Give Permissions
          run: sudo chmod +x dev-setup.sh

        - name: Run script
          run: ./dev-setup.sh